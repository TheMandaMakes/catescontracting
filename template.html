<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Meta Information -->
    <title>This is my Page Title | Brand / Business Name</title>
    <!-- Meta Description (The snippet shown under your link in Google results) -->
    <meta name="description" content="Here is my meta descrtiption.">
    <!-- Canonical Link (Prevents duplicate content issues) -->
    <link rel="canonical" href="https://example.com/your-page-url">
    <!-- Search Engine Robots Instructions -->
    <meta name="robots" content="index, follow">

    <!-- Open Graph Tags (Controls Facebook, LinkedIn, iMessage link previews) -->
    <meta property="og:title" content="Page Title - Main Keyword | Brand Name">
    <meta property="og:description" content="A concise summary of your page content.">
    <meta property="og:image" content="https://example.com/images/social-share-image.jpg">
    <meta property="og:url" content="https://example.com/your-page-url">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Your Brand Name">

    <!-- 7. Twitter Card Tags (Controls X / Twitter previews) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Page Title - Main Keyword | Brand Name">
    <meta name="twitter:description" content="A concise summary of your page content.">
    <meta name="twitter:image" content="https://example.com/images/social-share-image.jpg">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/126bfb5506.js" crossorigin="anonymous"></script>
   <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- JavaScript -->
    <script src="script.js" defer></script>

    <!-- JSON-LD Structured Data Block -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Your Brand Name",
        "url": "https://example.com",
        "logo": "https://example.com/logo.png"
    }
    </script>
    
    <!-- Bootstrap 5.3 CSS Link -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light">

    <!-- Simple Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Project Coordinator Sandbox</a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container my-5">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold text-primary">Bootstrap is Live!</h1>
                <p class="col-md-8 fs-4 text-secondary">This page uses the browser-based setup. No local terminal commands, node_modules, or package managers required.</p>
                <button class="btn btn-success btn-lg" type="button">Test Button</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JavaScript Bundle Link -->
    <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
